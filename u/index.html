<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race me on Stride</title>
<meta name="description" content="Stride turns the steps you already walk into races with friends and weekly leagues.">
<meta name="theme-color" content="#0B0D10">
<meta property="og:title" content="Race me on Stride">
<meta property="og:description" content="Every step counts. Races with friends, weekly leagues and Bib, your running buddy.">
<meta property="og:image" content="https://mosamir01.github.io/stride/icon.png">
<link rel="icon" href="../icon.png">
<link rel="apple-touch-icon" href="../icon.png">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&amp;family=JetBrains+Mono:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#0B0D10;color:#F3F5F8;
  font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:420px;box-sizing:border-box;padding:32px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.kicker{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;letter-spacing:.14em;color:#F97B2E}
h1{margin:0;font-size:34px;line-height:1.1;letter-spacing:-.03em}
p{margin:0;font-size:16px;line-height:1.45;color:#A6AEBB}
.open{margin-top:10px;width:100%;height:56px;border-radius:16px;background:#F97B2E;color:#0E1116;display:flex;align-items:center;
  justify-content:center;font-size:16px;font-weight:700;text-decoration:none}
.open:hover{background:#FF9A57;color:#0E1116}
.note{font-size:13.5px;color:#6B7484}
.note b{color:#A6AEBB;font-weight:600}
img.bib{width:150px;height:150px}
</style>
</head>
<body>
<main>
<img class="bib" src="../bib/determined.png" alt="">
<span class="kicker">STRIDE</span>
<h1 id="title">Race me on Stride.</h1>
<p>Every step counts: races with friends, weekly leagues, and Bib cheering you on.</p>
<a class="open" id="open" href="stride://">Open in Stride</a>
<a href="https://apps.apple.com/app/id6816761374" aria-label="Download Stride on the App Store"><img src="../app-store-badge.svg" alt="Download on the App Store" style="height:48px"></a>
<span class="note" id="note">Already have Stride? Tap <b>Open in Stride</b>.</span>
</main>
<script>
// stride://u/<name> opens the inviter's profile in the app; the name comes from the link (…/u/?mo2).
var name = decodeURIComponent(location.search.replace(/^\?/, '').split('&')[0] || '').toLowerCase();
if (/^[a-z0-9_]{3,20}$/.test(name)) {
  document.getElementById('title').textContent = '@' + name + ' wants to race you.';
  document.getElementById('open').href = 'stride://u/' + name;
  document.getElementById('note').innerHTML = 'Already have Stride? Tap <b>Open in Stride</b>, or add <b>@' + name + '</b> from You › Friends.';
}
</script>
</body>
</html>
